<template>
    <div class="slds-p-horizontal_medium">
        <template lwc:if={hasLead}>
            <!-- Page header (record-home) -->
            <ui-page-header
                variant="record-home"
                icon-name="standard:lead"
                object-label="Lead"
                title={leadName}
                fields={summaryFields}>
                <div slot="actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button
                                label={followLabel}
                                variant={followVariant}
                                icon-name={followIconName}
                                onclick={handleFollow}>
                            </lightning-button>
                        </div>
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="Edit" variant="neutral"></lightning-button>
                                <lightning-button label="Convert" variant="neutral"></lightning-button>
                                <lightning-button label="Clone" variant="neutral"></lightning-button>
                                <lightning-button-menu
                                    alternative-text="More Actions"
                                    variant="border-filled"
                                    icon-size="medium"
                                    menu-alignment="right">
                                    <lightning-menu-item label="Send Email" value="send_email"></lightning-menu-item>
                                    <lightning-menu-item label="Log a Call" value="log_call"></lightning-menu-item>
                                    <lightning-menu-item label="Create Task" value="create_task"></lightning-menu-item>
                                    <lightning-menu-item label="Delete" value="delete"></lightning-menu-item>
                                </lightning-button-menu>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </ui-page-header>

            <!-- Functional Path: status progression with mark-complete action -->
            <div class="c-lead-path slds-m-top_medium">
                <div class="slds-path">
                    <div class="slds-grid">
                        <div class="slds-path__track slds-grow">
                            <div class="slds-grid slds-path__scroller-container">
                                <div class="slds-path__scroller" role="application">
                                    <div class="slds-path__scroller_inner">
                                        <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                            <template for:each={pathSteps} for:item="step">
                                                <li key={step.name} class={step.itemClass} role="presentation">
                                                    <a
                                                        class="slds-path__link"
                                                        href="#"
                                                        role="option"
                                                        aria-selected={step.ariaSelected}
                                                        tabindex={step.tabindex}
                                                        data-name={step.name}
                                                        onclick={handleStepClick}>
                                                        <span class="slds-path__stage">
                                                            <template lwc:if={step.isComplete}>
                                                                <lightning-icon
                                                                    icon-name="utility:check"
                                                                    size="x-small"
                                                                    variant="inverse"
                                                                    alternative-text="Stage complete">
                                                                </lightning-icon>
                                                            </template>
                                                            <template lwc:elseif={step.isCurrent}>
                                                                <span class="slds-assistive-text">Current Stage:</span>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="slds-assistive-text">Stage:</span>
                                                            </template>
                                                        </span>
                                                        <span class="slds-path__title">{step.label}</span>
                                                    </a>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-path__action slds-p-around_x-small">
                            <lightning-button
                                label={markCompleteLabel}
                                variant="brand"
                                icon-name="utility:check"
                                disabled={isPathClosed}
                                onclick={handleMarkComplete}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Body: Tabs (8/12) + Right rail (4/12) -->
            <div class="slds-grid slds-gutters slds-m-top_medium">
                <!-- LEFT COLUMN: Single shell with Related/Details tabs.
                     Mirrors the campaignDetail layout: outer rounded white
                     container holds the lightning-tabset, and each related
                     list lives in its own bordered card stacked inside the
                     active tab. -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">

                    <article class="c-lead-detail__related-shell">
                        <lightning-tabset class="c-lead-detail__tabset">

                            <!-- ============ RELATED TAB ============ -->
                            <lightning-tab label="Related">
                                <!-- Purchase Intent card -->
                                <article class="c-lead-detail__card c-lead-detail__card_first">
                                    <header class="c-lead-detail__card-header">
                                        <div class="c-lead-detail__card-title">
                                            <span class="c-lead-detail__card-icon">
                                                <lightning-icon
                                                    icon-name="standard:einstein"
                                                    size="small"
                                                    alternative-text="Purchase intent">
                                                </lightning-icon>
                                            </span>
                                            <h2 class="c-lead-detail__card-heading">
                                                <a href="#">{purchaseIntentTitle}</a>
                                            </h2>
                                        </div>
                                        <div class="c-lead-detail__card-actions">
                                            <lightning-button-group>
                                                <lightning-button label="New" variant="neutral"></lightning-button>
                                                <lightning-button-menu
                                                    alternative-text="More Purchase Intent Actions"
                                                    variant="border-filled"
                                                    icon-size="small"
                                                    menu-alignment="right">
                                                    <lightning-menu-item label="Refresh" value="refresh"></lightning-menu-item>
                                                    <lightning-menu-item label="Export" value="export"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </lightning-button-group>
                                        </div>
                                    </header>
                                    <template lwc:if={hasPurchaseIntents}>
                                        <div class="c-lead-detail__table-wrap">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered c-lead-detail__table">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Product">Product</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Score">Score</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Predicted Close">Predicted Close</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Signal Strength">Signal Strength</div></th>
                                                        <th scope="col" class="c-lead-detail__row-actions-col">
                                                            <span class="slds-assistive-text">Actions</span>
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={purchaseIntents} for:item="row">
                                                        <tr key={row.id} class="slds-hint-parent">
                                                            <th scope="row" data-label="Product"><div class="slds-truncate" title={row.product}>{row.product}</div></th>
                                                            <td data-label="Score"><div class="slds-truncate" title={row.score}>{row.score}</div></td>
                                                            <td data-label="Predicted Close"><div class="slds-truncate" title={row.predictedClose}>{row.predictedClose}</div></td>
                                                            <td data-label="Signal Strength"><div class="slds-truncate" title={row.signal}>{row.signal}</div></td>
                                                            <td class="c-lead-detail__row-actions-cell">
                                                                <lightning-button-icon
                                                                    icon-name="utility:down"
                                                                    variant="bare"
                                                                    size="x-small"
                                                                    alternative-text="Show row actions"
                                                                    title="Show actions">
                                                                </lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="c-lead-detail__empty">No purchase intent signals yet.</p>
                                    </template>
                                    <footer class="c-lead-detail__card-footer">
                                        <a href="#">View All</a>
                                    </footer>
                                </article>

                                <!-- Quotes card -->
                                <article class="c-lead-detail__card">
                                    <header class="c-lead-detail__card-header">
                                        <div class="c-lead-detail__card-title">
                                            <span class="c-lead-detail__card-icon">
                                                <lightning-icon
                                                    icon-name="standard:quotes"
                                                    size="small"
                                                    alternative-text="Quotes">
                                                </lightning-icon>
                                            </span>
                                            <h2 class="c-lead-detail__card-heading">
                                                <a href="#">{quotesTitle}</a>
                                            </h2>
                                        </div>
                                        <div class="c-lead-detail__card-actions">
                                            <lightning-button-group>
                                                <lightning-button label="New Quote" variant="neutral"></lightning-button>
                                                <lightning-button-menu
                                                    alternative-text="More Quote Actions"
                                                    variant="border-filled"
                                                    icon-size="small"
                                                    menu-alignment="right">
                                                    <lightning-menu-item label="Refresh" value="refresh"></lightning-menu-item>
                                                    <lightning-menu-item label="Export" value="export"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </lightning-button-group>
                                        </div>
                                    </header>
                                    <template lwc:if={hasQuotes}>
                                        <div class="c-lead-detail__table-wrap">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered c-lead-detail__table">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Quote Number">Quote Number</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Amount">Amount</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Expiration Date">Expiration Date</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Owner">Owner</div></th>
                                                        <th scope="col" class="c-lead-detail__row-actions-col">
                                                            <span class="slds-assistive-text">Actions</span>
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={quotes} for:item="row">
                                                        <tr key={row.id} class="slds-hint-parent">
                                                            <th scope="row" data-label="Quote Number"><div class="slds-truncate" title={row.number}><a href="#">{row.number}</a></div></th>
                                                            <td data-label="Status"><div class="slds-truncate" title={row.status}>{row.status}</div></td>
                                                            <td data-label="Amount"><div class="slds-truncate" title={row.amount}>{row.amount}</div></td>
                                                            <td data-label="Expiration Date"><div class="slds-truncate" title={row.expirationDate}>{row.expirationDate}</div></td>
                                                            <td data-label="Owner"><div class="slds-truncate" title={row.owner}>{row.owner}</div></td>
                                                            <td class="c-lead-detail__row-actions-cell">
                                                                <lightning-button-icon
                                                                    icon-name="utility:down"
                                                                    variant="bare"
                                                                    size="x-small"
                                                                    alternative-text="Show row actions"
                                                                    title="Show actions">
                                                                </lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="c-lead-detail__empty">No quotes generated for this lead yet.</p>
                                    </template>
                                    <footer class="c-lead-detail__card-footer">
                                        <a href="#">View All</a>
                                    </footer>
                                </article>
                            </lightning-tab>

                            <!-- ============ DETAILS TAB ============ -->
                            <lightning-tab label="Details">
                                <div class="c-lead-detail__details-body">
                                    <template for:each={detailSections} for:item="section">
                                        <div key={section.id} class={section.sectionClass}>
                                            <h3 class="slds-section__title">
                                                <button
                                                    aria-controls={section.contentId}
                                                    aria-expanded={section.ariaExpanded}
                                                    class="slds-button slds-section__title-action"
                                                    data-id={section.id}
                                                    onclick={handleSectionToggle}
                                                    type="button">
                                                    <lightning-icon
                                                        class="slds-section__title-action-icon slds-button__icon slds-button__icon_left"
                                                        icon-name="utility:switch"
                                                        size="x-small"
                                                        alternative-text="Toggle section">
                                                    </lightning-icon>
                                                    <span class="slds-truncate" title={section.title}>{section.title}</span>
                                                </button>
                                            </h3>
                                            <div
                                                aria-hidden={section.ariaHidden}
                                                class="slds-section__content"
                                                id={section.contentId}>
                                                <div class="c-lead-detail__section-grid">
                                                    <template for:each={section.fields} for:item="field">
                                                        <lightning-textarea
                                                            lwc:if={field.isTextarea}
                                                            key={field.key}
                                                            class={field.cssClass}
                                                            label={field.label}
                                                            value={field.value}
                                                            read-only>
                                                        </lightning-textarea>
                                                        <lightning-input
                                                            lwc:else
                                                            key={field.key}
                                                            class={field.cssClass}
                                                            label={field.label}
                                                            value={field.value}
                                                            type={field.type}
                                                            read-only>
                                                        </lightning-input>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </lightning-tab>
                        </lightning-tabset>
                    </article>
                </div>

                <!-- Right rail: Activity Feed + Contact Information -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <ui-activity-feed
                        title="Activity"
                        sections={activityFeedSections}>
                    </ui-activity-feed>

                    <div class="slds-m-top_medium">
                        <lightning-card title={contactsCardTitle} icon-name="standard:contact">
                            <lightning-button
                                slot="actions"
                                label="New"
                                variant="neutral">
                            </lightning-button>
                            <template lwc:if={hasRelatedContacts}>
                                <ul class="slds-has-dividers_top-space">
                                    <template for:each={relatedContacts} for:item="contact">
                                        <li key={contact.id} class="slds-item slds-p-vertical_small slds-p-horizontal_medium">
                                            <article class="slds-media">
                                                <div class="slds-media__figure">
                                                    <lightning-icon
                                                        icon-name="standard:contact"
                                                        size="small"
                                                        alternative-text="Contact">
                                                    </lightning-icon>
                                                </div>
                                                <div class="slds-media__body slds-has-flexi-truncate">
                                                    <header class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                        <h3 class="slds-text-heading_small slds-truncate" title={contact.name}>
                                                            <a href="#">{contact.name}</a>
                                                        </h3>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-no-flex slds-m-left_x-small slds-truncate" title={contact.title}>
                                                            {contact.title}
                                                        </p>
                                                    </header>
                                                    <dl class="c-lead-contact-fields slds-m-top_x-small">
                                                        <div class="c-lead-contact-fields__row">
                                                            <dt class="slds-text-body_small slds-text-color_weak">Mobile Phone</dt>
                                                            <dd class="slds-text-body_small slds-truncate" title={contact.mobilePhone}>
                                                                <a href={contact.mobileHref}>{contact.mobilePhone}</a>
                                                            </dd>
                                                        </div>
                                                        <div class="c-lead-contact-fields__row">
                                                            <dt class="slds-text-body_small slds-text-color_weak">Work Phone</dt>
                                                            <dd class="slds-text-body_small slds-truncate" title={contact.workPhone}>
                                                                <a href={contact.workHref}>{contact.workPhone}</a>
                                                            </dd>
                                                        </div>
                                                        <div class="c-lead-contact-fields__row">
                                                            <dt class="slds-text-body_small slds-text-color_weak">Email</dt>
                                                            <dd class="slds-text-body_small slds-truncate" title={contact.email}>
                                                                <a href={contact.emailHref}>{contact.email}</a>
                                                            </dd>
                                                        </div>
                                                        <div class="c-lead-contact-fields__row">
                                                            <dt class="slds-text-body_small slds-text-color_weak">Date of Birth</dt>
                                                            <dd class="slds-text-body_small slds-truncate" title={contact.dateOfBirthLabel}>
                                                                {contact.dateOfBirthLabel}
                                                            </dd>
                                                        </div>
                                                    </dl>
                                                </div>
                                            </article>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-p-around_medium slds-text-body_small slds-text-color_weak">
                                    No related contacts.
                                </p>
                            </template>
                            <div slot="footer">
                                <a href="#">View All</a>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                <p class="slds-text-heading_medium">Lead not found</p>
                <p class="slds-m-top_small">
                    <lightning-button label="Back to Leads" variant="brand" onclick={handleBackToList}></lightning-button>
                </p>
            </div>
        </template>
    </div>
</template>
