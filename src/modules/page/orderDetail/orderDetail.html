<template>
    <div class="slds-p-horizontal_medium">
        <template lwc:if={hasOrder}>
            <!-- Record header -->
            <ui-page-header
                variant="record-home"
                icon-name="standard:orders"
                object-label="Order"
                title={orderTitle}
                fields={summaryFields}>
                <div slot="actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button
                                label={followLabel}
                                variant={followVariant}
                                icon-name={followIconName}
                                onclick={handleFollow}>
                            </lightning-button>
                        </div>
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="Edit" variant="neutral"></lightning-button>
                                <lightning-button label="Clone" variant="neutral"></lightning-button>
                                <lightning-button label="Activate" variant="neutral"></lightning-button>
                                <lightning-button-menu
                                    alternative-text="More Actions"
                                    variant="border-filled"
                                    icon-size="medium"
                                    menu-alignment="right">
                                    <lightning-menu-item label="Generate Invoice" value="generate_invoice"></lightning-menu-item>
                                    <lightning-menu-item label="Submit for Approval" value="submit_approval"></lightning-menu-item>
                                    <lightning-menu-item label="Printable View" value="printable"></lightning-menu-item>
                                    <lightning-menu-item label="Delete" value="delete"></lightning-menu-item>
                                </lightning-button-menu>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </ui-page-header>

            <!-- Functional Path: 6 delivery stages with mark-complete action. -->
            <div class="c-order-detail__path slds-m-top_medium">
                <div class="slds-path">
                    <div class="slds-grid">
                        <div class="slds-path__track slds-grow">
                            <div class="slds-grid slds-path__scroller-container">
                                <div class="slds-path__scroller" role="application">
                                    <div class="slds-path__scroller_inner">
                                        <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                            <template for:each={pathSteps} for:item="step">
                                                <li key={step.name} class={step.itemClass} role="presentation">
                                                    <a
                                                        class="slds-path__link"
                                                        href="#"
                                                        role="option"
                                                        aria-selected={step.ariaSelected}
                                                        tabindex={step.tabindex}
                                                        data-name={step.name}
                                                        onclick={handleStepClick}>
                                                        <span class="slds-path__stage">
                                                            <template lwc:if={step.isComplete}>
                                                                <lightning-icon
                                                                    icon-name="utility:check"
                                                                    size="x-small"
                                                                    variant="inverse"
                                                                    alternative-text="Stage complete">
                                                                </lightning-icon>
                                                            </template>
                                                            <template lwc:elseif={step.isCurrent}>
                                                                <span class="slds-assistive-text">Current Stage:</span>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="slds-assistive-text">Stage:</span>
                                                            </template>
                                                        </span>
                                                        <span class="slds-path__title">{step.label}</span>
                                                    </a>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-path__action c-order-detail__path-action">
                            <lightning-button
                                label={markCompleteLabel}
                                variant="brand"
                                icon-name="utility:check"
                                disabled={isPathClosed}
                                onclick={handleMarkComplete}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Body: two-column grid (left 8/12, right 4/12). -->
            <div class="slds-grid slds-gutters slds-m-top_medium">
                <!-- LEFT COLUMN: tabset (Related / Details) -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                    <article class="c-order-detail__shell">
                        <lightning-tabset class="c-order-detail__tabset">

                            <!-- ============ RELATED TAB ============ -->
                            <lightning-tab label="Related">
                                <!-- Order Products card -->
                                <article class="c-order-detail__card c-order-detail__card_first">
                                    <header class="c-order-detail__card-header">
                                        <div class="c-order-detail__card-title">
                                            <span class="c-order-detail__card-icon">
                                                <lightning-icon
                                                    icon-name="standard:product"
                                                    size="small"
                                                    alternative-text="Order Products">
                                                </lightning-icon>
                                            </span>
                                            <h2 class="c-order-detail__card-heading">
                                                <a href="#">{productsCardTitle}</a>
                                            </h2>
                                        </div>
                                        <div class="c-order-detail__card-actions">
                                            <lightning-button-group>
                                                <lightning-button label="Add Products" variant="neutral"></lightning-button>
                                                <lightning-button label="Edit Products" variant="neutral"></lightning-button>
                                                <lightning-button-menu
                                                    alternative-text="More Product Actions"
                                                    variant="border-filled"
                                                    icon-size="small"
                                                    menu-alignment="right">
                                                    <lightning-menu-item label="Refresh" value="refresh"></lightning-menu-item>
                                                    <lightning-menu-item label="Export" value="export"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </lightning-button-group>
                                        </div>
                                    </header>
                                    <template lwc:if={hasProducts}>
                                        <div class="c-order-detail__table-wrap">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered c-order-detail__table">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Product Code">Product Code</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Product">Product</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Quantity">Quantity</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Unit Price">Unit Price</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Discount">Discount</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Total Price">Total Price</div></th>
                                                        <th scope="col" class="c-order-detail__row-actions-col">
                                                            <span class="slds-assistive-text">Actions</span>
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={products} for:item="row">
                                                        <tr key={row.rowKey} class="slds-hint-parent">
                                                            <th scope="row" data-label="Product Code"><div class="slds-truncate" title={row.productCode}><a href="#">{row.productCode}</a></div></th>
                                                            <td data-label="Product"><div class="slds-truncate" title={row.productName}>{row.productName}</div></td>
                                                            <td data-label="Quantity"><div class="slds-truncate" title={row.quantity}>{row.quantity}</div></td>
                                                            <td data-label="Unit Price"><div class="slds-truncate" title={row.unitPrice}>{row.unitPrice}</div></td>
                                                            <td data-label="Discount"><div class="slds-truncate" title={row.discount}>{row.discount}</div></td>
                                                            <td data-label="Total Price"><div class="slds-truncate" title={row.totalPrice}>{row.totalPrice}</div></td>
                                                            <td class="c-order-detail__row-actions-cell">
                                                                <lightning-button-icon
                                                                    icon-name="utility:down"
                                                                    variant="bare"
                                                                    size="x-small"
                                                                    alternative-text="Show row actions"
                                                                    title="Show actions">
                                                                </lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="c-order-detail__empty">No products added to this order yet.</p>
                                    </template>
                                    <footer class="c-order-detail__card-footer">
                                        <a href="#">View All</a>
                                    </footer>
                                </article>

                                <!-- Order History card -->
                                <article class="c-order-detail__card">
                                    <header class="c-order-detail__card-header">
                                        <div class="c-order-detail__card-title">
                                            <span class="c-order-detail__card-icon">
                                                <lightning-icon
                                                    icon-name="standard:record_lookup"
                                                    size="small"
                                                    alternative-text="Order History">
                                                </lightning-icon>
                                            </span>
                                            <h2 class="c-order-detail__card-heading">
                                                <a href="#">{historyCardTitle}</a>
                                            </h2>
                                        </div>
                                        <div class="c-order-detail__card-actions">
                                            <lightning-button-menu
                                                alternative-text="More History Actions"
                                                variant="border-filled"
                                                icon-size="small"
                                                menu-alignment="right">
                                                <lightning-menu-item label="Refresh" value="refresh"></lightning-menu-item>
                                                <lightning-menu-item label="Export" value="export"></lightning-menu-item>
                                            </lightning-button-menu>
                                        </div>
                                    </header>
                                    <template lwc:if={hasHistory}>
                                        <div class="c-order-detail__table-wrap">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered c-order-detail__table">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Date">Date</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="User">User</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Action">Action</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Field">Field</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="Original Value">Original Value</div></th>
                                                        <th class="slds-text-title_caps" scope="col"><div class="slds-truncate" title="New Value">New Value</div></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={history} for:item="row">
                                                        <tr key={row.rowKey} class="slds-hint-parent">
                                                            <th scope="row" data-label="Date"><div class="slds-truncate" title={row.date}>{row.date}</div></th>
                                                            <td data-label="User"><div class="slds-truncate" title={row.user}><a href="#">{row.user}</a></div></td>
                                                            <td data-label="Action"><div class="slds-truncate" title={row.action}>{row.action}</div></td>
                                                            <td data-label="Field"><div class="slds-truncate" title={row.field}>{row.field}</div></td>
                                                            <td data-label="Original Value"><div class="slds-truncate" title={row.oldValue}>{row.oldValue}</div></td>
                                                            <td data-label="New Value"><div class="slds-truncate" title={row.newValue}>{row.newValue}</div></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="c-order-detail__empty">No history entries yet.</p>
                                    </template>
                                    <footer class="c-order-detail__card-footer">
                                        <a href="#">View All</a>
                                    </footer>
                                </article>

                                <!-- Notes & Attachments card (file upload dropzone) -->
                                <article class="c-order-detail__card">
                                    <header class="c-order-detail__card-header">
                                        <div class="c-order-detail__card-title">
                                            <span class="c-order-detail__card-icon c-order-detail__card-icon_muted">
                                                <lightning-icon
                                                    icon-name="doctype:attachment"
                                                    size="small"
                                                    alternative-text="Notes & Attachments">
                                                </lightning-icon>
                                            </span>
                                            <h2 class="c-order-detail__card-heading">
                                                <a href="#">{notesCardTitle}</a>
                                            </h2>
                                        </div>
                                        <div class="c-order-detail__card-actions">
                                            <lightning-button-group>
                                                <lightning-button label="New Note" variant="neutral"></lightning-button>
                                                <lightning-button label="Upload Files" variant="neutral"></lightning-button>
                                            </lightning-button-group>
                                        </div>
                                    </header>
                                    <div class="c-order-detail__file-drop">
                                        <lightning-icon
                                            icon-name="utility:upload"
                                            size="small"
                                            alternative-text="Upload">
                                        </lightning-icon>
                                        <p class="c-order-detail__file-helper">Drag files here or</p>
                                        <lightning-button
                                            label="Browse Files"
                                            variant="neutral"
                                            icon-name="utility:open_folder"
                                            class="c-order-detail__file-button">
                                        </lightning-button>
                                        <p class="c-order-detail__file-hint">Accepted formats: PDF, DOC, XLS, PPT, PNG, JPG (max 25 MB)</p>
                                    </div>
                                </article>
                            </lightning-tab>

                            <!-- ============ DETAILS TAB ============ -->
                            <lightning-tab label="Details">
                                <div class="c-order-detail__details-body">
                                    <template for:each={detailSections} for:item="section">
                                        <div key={section.id} class={section.sectionClass}>
                                            <h3 class="slds-section__title">
                                                <button
                                                    aria-controls={section.contentId}
                                                    aria-expanded={section.ariaExpanded}
                                                    class="slds-button slds-section__title-action"
                                                    data-id={section.id}
                                                    onclick={handleSectionToggle}
                                                    type="button">
                                                    <lightning-icon
                                                        class="slds-section__title-action-icon slds-button__icon slds-button__icon_left"
                                                        icon-name="utility:switch"
                                                        size="x-small"
                                                        alternative-text="Toggle section">
                                                    </lightning-icon>
                                                    <span class="slds-truncate" title={section.title}>{section.title}</span>
                                                </button>
                                            </h3>
                                            <div
                                                aria-hidden={section.ariaHidden}
                                                class="slds-section__content"
                                                id={section.contentId}>

                                                <!-- Address section: two side-by-side address blocks
                                                     each with a small map preview below. -->
                                                <template lwc:if={section.isAddressSection}>
                                                    <div class="c-order-detail__address-grid">
                                                        <div class="c-order-detail__address-block">
                                                            <div class="c-order-detail__address-label-row">
                                                                <span class="c-order-detail__address-label">Billing Address</span>
                                                                <button
                                                                    class="slds-button slds-button_icon slds-button_icon-x-small c-order-detail__inline-edit"
                                                                    title="Edit Billing Address"
                                                                    type="button">
                                                                    <lightning-icon
                                                                        icon-name="utility:edit"
                                                                        size="xx-small"
                                                                        alternative-text="Edit Billing Address">
                                                                    </lightning-icon>
                                                                </button>
                                                            </div>
                                                            <p class="c-order-detail__address-text">{billingAddress.line1}</p>
                                                            <p class="c-order-detail__address-text">{billingAddress.line2}</p>
                                                            <p class="c-order-detail__address-text">{billingAddress.country}</p>
                                                            <a
                                                                class="c-order-detail__map"
                                                                href={billingAddress.mapHref}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                title={billingAddress.mapAlt}>
                                                                <div class="c-order-detail__map-preview c-order-detail__map-preview_billing" aria-hidden="true">
                                                                    <lightning-icon
                                                                        icon-name="utility:location"
                                                                        size="small"
                                                                        alternative-text="Map pin">
                                                                    </lightning-icon>
                                                                </div>
                                                                <span class="c-order-detail__map-caption">Open in Maps</span>
                                                            </a>
                                                        </div>
                                                        <div class="c-order-detail__address-block">
                                                            <div class="c-order-detail__address-label-row">
                                                                <span class="c-order-detail__address-label">Shipping Address</span>
                                                                <button
                                                                    class="slds-button slds-button_icon slds-button_icon-x-small c-order-detail__inline-edit"
                                                                    title="Edit Shipping Address"
                                                                    type="button">
                                                                    <lightning-icon
                                                                        icon-name="utility:edit"
                                                                        size="xx-small"
                                                                        alternative-text="Edit Shipping Address">
                                                                    </lightning-icon>
                                                                </button>
                                                            </div>
                                                            <p class="c-order-detail__address-text">{shippingAddress.line1}</p>
                                                            <p class="c-order-detail__address-text">{shippingAddress.line2}</p>
                                                            <p class="c-order-detail__address-text">{shippingAddress.country}</p>
                                                            <a
                                                                class="c-order-detail__map"
                                                                href={shippingAddress.mapHref}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                title={shippingAddress.mapAlt}>
                                                                <div class="c-order-detail__map-preview c-order-detail__map-preview_shipping" aria-hidden="true">
                                                                    <lightning-icon
                                                                        icon-name="utility:location"
                                                                        size="small"
                                                                        alternative-text="Map pin">
                                                                    </lightning-icon>
                                                                </div>
                                                                <span class="c-order-detail__map-caption">Open in Maps</span>
                                                            </a>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- Standard field section: two-column read-only grid
                                                     with optional inline-edit pencil icons. -->
                                                <template lwc:else>
                                                    <div class="c-order-detail__section-grid">
                                                        <template for:each={section.fields} for:item="field">
                                                            <div key={field.key} class={field.cssClass}>
                                                                <lightning-textarea
                                                                    lwc:if={field.isTextarea}
                                                                    label={field.label}
                                                                    value={field.value}
                                                                    read-only>
                                                                </lightning-textarea>
                                                                <lightning-input
                                                                    lwc:else
                                                                    label={field.label}
                                                                    value={field.value}
                                                                    type={field.type}
                                                                    read-only>
                                                                </lightning-input>
                                                                <template lwc:if={field.isEditable}>
                                                                    <button
                                                                        class="slds-button slds-button_icon slds-button_icon-x-small c-order-detail__inline-edit c-order-detail__inline-edit_field"
                                                                        title="Edit"
                                                                        type="button">
                                                                        <lightning-icon
                                                                            icon-name="utility:edit"
                                                                            size="xx-small"
                                                                            alternative-text="Edit">
                                                                        </lightning-icon>
                                                                    </button>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </lightning-tab>
                        </lightning-tabset>
                    </article>
                </div>

                <!-- RIGHT COLUMN: Activity feed + Alerts -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">

                    <ui-activity-feed
                        title="Activity"
                        sections={activityFeedSections}
                        footer-text={activityFooterText}>
                    </ui-activity-feed>

                    <!-- Alerts card. Mirrors the SLDS Card pattern (header / body / centered footer)
                         shown in the design reference: a single overflow menu in the header, a
                         dense list of single-line accordion-style rows in the body, and a
                         centered "View All" link in the footer. -->
                    <article class="c-order-detail__card c-order-detail__alerts slds-m-top_medium">
                        <header class="c-order-detail__card-header">
                            <div class="c-order-detail__card-title">
                                <span class="c-order-detail__card-icon c-order-detail__card-icon_warning">
                                    <lightning-icon
                                        icon-name="utility:notification"
                                        size="x-small"
                                        alternative-text="Alerts">
                                    </lightning-icon>
                                </span>
                                <h2 class="c-order-detail__card-heading">{alertsCardTitle}</h2>
                            </div>
                            <div class="c-order-detail__card-actions">
                                <lightning-button-menu
                                    alternative-text="More Alert Actions"
                                    variant="border-filled"
                                    icon-size="small"
                                    menu-alignment="right">
                                    <lightning-menu-item label="Refresh" value="refresh"></lightning-menu-item>
                                    <lightning-menu-item label="Acknowledge All" value="ack_all"></lightning-menu-item>
                                    <lightning-menu-item label="Mute Alerts" value="mute"></lightning-menu-item>
                                </lightning-button-menu>
                            </div>
                        </header>
                        <template lwc:if={hasAlerts}>
                            <ul class="c-order-detail__alerts-list">
                                <template for:each={alerts} for:item="alert">
                                    <li key={alert.id} class="c-order-detail__alert-item">
                                        <span class="c-order-detail__alert-chevron" aria-hidden="true">
                                            <lightning-icon
                                                icon-name="utility:chevronright"
                                                size="xx-small"
                                                alternative-text="">
                                            </lightning-icon>
                                        </span>
                                        <span class="c-order-detail__alert-icon">
                                            <lightning-icon
                                                icon-name={alert.iconName}
                                                size="xx-small"
                                                variant="warning"
                                                alternative-text="Warning">
                                            </lightning-icon>
                                        </span>
                                        <p class="c-order-detail__alert-text slds-truncate" title={alert.message}>
                                            {alert.title}
                                        </p>
                                        <div class="c-order-detail__alert-actions">
                                            <lightning-button-menu
                                                alternative-text="Alert row actions"
                                                variant="border-filled"
                                                icon-size="x-small"
                                                menu-alignment="right">
                                                <lightning-menu-item label="View Details" value="view"></lightning-menu-item>
                                                <lightning-menu-item label="Acknowledge" value="ack"></lightning-menu-item>
                                                <lightning-menu-item label="Snooze" value="snooze"></lightning-menu-item>
                                                <lightning-menu-item label="Dismiss" value="dismiss"></lightning-menu-item>
                                            </lightning-button-menu>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                            <footer class="c-order-detail__card-footer">
                                <a href="#" onclick={handleViewAllAlerts}>View All</a>
                            </footer>
                        </template>
                        <template lwc:else>
                            <p class="c-order-detail__empty">No active alerts for this order.</p>
                        </template>
                    </article>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                <p class="slds-text-heading_medium">Order not found</p>
                <p class="slds-m-top_small">
                    <lightning-button label="Back to Orders" variant="brand" onclick={handleBackToList}></lightning-button>
                </p>
            </div>
        </template>
    </div>
</template>
